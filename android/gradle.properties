org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# === NOUVELLES CONFIGURATIONS POUR TÉLÉCHARGEMENT SÉQUENTIEL ===

# Désactiver TOUT parallélisme
org.gradle.parallel=false
org.gradle.configureondemand=false

# Limiter à 1 seule connexion/téléchargement à la fois
org.gradle.workers.max=1
org.gradle.welcome=never

# Timeouts très longs pour connexions lentes
org.gradle.http.timeout=900000
org.gradle.http.retry=5
org.gradle.daemon=false

# Désactiver la vérification SSL si problème réseau (optionnel)
org.gradle.warning.mode=summary

# Buffer et cache optimisés
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.maxConnections=1s