org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true

# Sequential downloads / low parallelism (slow networks)
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.workers.max=1
org.gradle.welcome=never

# Long timeouts
org.gradle.http.timeout=900000
org.gradle.http.retry=5

# Keep a long-lived daemon to avoid single-use daemon fork noise
org.gradle.daemon=true

org.gradle.warning.mode=all

# HTTP client tuning
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.maxConnections=1

# Flutter 3.44: keep until all plugins migrate to AGP 9 built-in Kotlin / new DSL.
# See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
